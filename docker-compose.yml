services:
  # ------------------------------------------------------------------
  # 1. Turbo Rust Daemon (Typst 0.15.1 en mémoire — polices en RAM)
  #    Buildé une seule fois & caché ; partage un Unix Socket avec fx-server
  # ------------------------------------------------------------------
  typst-renderd:
    build:
      context: ./rust/typst-renderd
      dockerfile: Dockerfile
    environment:
      - TYPST_DAEMON_SOCKET=/var/run/typst/typst-renderd.sock
      - TYPST_DAEMON_LISTEN=0.0.0.0:9090
      - TYPST_FONT_PATHS=/fonts
      - TYPST_IGNORE_SYSTEM_FONTS=${TYPST_IGNORE_SYSTEM_FONTS:-false}
    volumes:
      - typst-sock:/var/run/typst
      - ./fonts:/fonts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s

  # ------------------------------------------------------------------
  # 2. Serveur API Go fX v2 (Moteur universel + Studio + Factur-X + IA)
  #    Build ultra-rapide en compose (Rust et Angular sont dans leurs services)
  # ------------------------------------------------------------------
  fx-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_RUST_DAEMON: "false"
        BUILD_WEB_UI: "false"
    shm_size: "512m"
    ports:
      - "8080:8080"
    depends_on:
      typst-renderd:
        condition: service_healthy
    environment:
      # Serveur
      - PORT=8080
      - HOST=0.0.0.0
      - READ_TIMEOUT=300
      - WRITE_TIMEOUT=300
      - WEB_UI_ENABLED=false

      # Storage - Local (dev)
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/storage

      # Authentication (lit .env si présent)
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_API_KEY=${AUTH_API_KEY:-api-key}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-123456}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-super-secret}

      # Moteur de rendu universel fX v2 branché sur le daemon Rust via Unix Socket
      - RENDER_BACKEND=${RENDER_BACKEND:-auto}
      - RENDER_WORKERS=${RENDER_WORKERS:-0}
      - RENDER_DAEMON_SOCKET=/var/run/typst/typst-renderd.sock
      - RENDER_DAEMON_URL=http://typst-renderd:9090
      - RENDER_TMP_DIR=${RENDER_TMP_DIR:-/dev/shm/fx-render}
      - RENDER_MAX_BATCH_SIZE=${RENDER_MAX_BATCH_SIZE:-100}
      - TYPST_IGNORE_SYSTEM_FONTS=${TYPST_IGNORE_SYSTEM_FONTS:-false}

      # Templates & polices custom (sandbox isolé automatique par compilation)
      - TEMPLATES_PATH=/templates-custom
      - TYPST_FONT_PATHS=/fonts

      # AI Generation (lit .env si présent)
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_BASE_URL=${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - AI_MODEL=${AI_MODEL:-gemini-4-hydrogen}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_CLI_COMMAND=${AI_CLI_COMMAND:-agy}
      - AI_CLI_ARGS=${AI_CLI_ARGS:-}
      - AI_CLI_EFFORT=${AI_CLI_EFFORT:-}
      - AI_CLI_TIMEOUT=${AI_CLI_TIMEOUT:-180}

      # Feature Flags
      - STUDIO_ENABLED=${STUDIO_ENABLED:-true}
      - ALLOW_CUSTOM_TEMPLATES=${ALLOW_CUSTOM_TEMPLATES:-true}
    volumes:
      - typst-sock:/var/run/typst
      - ./storage:/storage
      - ./templates-custom:/templates-custom
      - ./fonts:/fonts
      - ./images:/images
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/api/v1/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ------------------------------------------------------------------
  # 3. Studio Builder v2 Angular 21 (Hot-reload dev sur :4200)
  # ------------------------------------------------------------------
  ng-web:
    build:
      context: ./ng_web
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      fx-server:
        condition: service_healthy
    environment:
      - API_PROXY_TARGET=http://fx-server:8080
    volumes:
      - ./ng_web/src:/app/src
      - ./ng_web/proxy.conf.js:/app/proxy.conf.js:ro
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Optionnel : proxy Ollama local (`docker compose --profile ollama up`)
  # ------------------------------------------------------------------
  ollama-proxy:
    image: alpine/socat
    profiles: ["ollama"]
    network_mode: "host"
    command: tcp-listen:11435,fork,reuseaddr tcp:127.0.0.1:11434
    restart: unless-stopped

volumes:
  typst-sock:

networks:
  default:
    name: fx-network
